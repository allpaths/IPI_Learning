# Jupyter Book configuration.
# Built by GitHub Actions on push to master and deployed to GitHub Pages.

title: "Information Physics & Information Theory"
author: "Jeff Dillon"
copyright: "2026"
logo: ""

# Force a clean rebuild of every notebook on each deploy.
# The notebooks are small (numpy + matplotlib) so this is fast and removes
# any risk of stale outputs.
execute:
  execute_notebooks: force
  timeout: 300

# Skip these files when building. The READMEs are developer-facing
# (rendered on GitHub) and not part of the published book.
exclude_patterns:
  - README.md
  - "Video_*/README.md"
  - "**/.ipynb_checkpoints/**"
  - "_build/**"
  - "scripts/**"
  - "RESUME.md"
  - ".venv/**"
  - "venv/**"
  - ".github/**"

# Link "open on GitHub" / "edit" / repository buttons in the top-right.
#
# `branch` is also used to build the Binder and Colab launch URLs.
# Pointing it at a tag (instead of "master") means Binder doesn't need to hit
# GitHub's API to resolve the ref each time — it serves a cached image keyed
# by the tag, which avoids the intermittent "503 GitHub rate limit" message
# during Binder builds. Bump the tag with:
#     git tag -f v1 && git push -f origin v1
# to publish a new snapshot to Binder.
repository:
  url: https://github.com/allpaths/IPI_Learning
  branch: v1

# 🚀 Launch buttons (top-right of each notebook page).
# Both Binder and Colab build the environment on the fly from this repo.
launch_buttons:
  notebook_interface: jupyterlab
  binderhub_url: https://mybinder.org
  colab_url: https://colab.research.google.com

html:
  use_repository_button: true
  use_issues_button: false
  use_edit_page_button: false
  home_page_in_navbar: true
  favicon: ""

# Render math from LaTeX in markdown cells.
parse:
  myst_enable_extensions:
    - dollarmath
    - amsmath
    - colon_fence

sphinx:
  config:
    html_show_copyright: true
    html_static_path: ["_static"]
    html_css_files: ["custom.css", "checkyourself.css"]
    html_js_files: ["matrix_rain.js", "checkyourself.js"]
    # Suppress the "headings start at H2" warning — the H1 lives inside the
    # custom HTML hero block on index.md, which MyST doesn't see as a
    # markdown heading.
    suppress_warnings: ["myst.header"]
    mathjax3_config:
      tex:
        macros:
          "X": "\\mathcal{X}"
