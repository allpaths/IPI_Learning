name: deploy-book

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        # Pin to jupyter-book v1.x (Sphinx-based "classic" Jupyter Book).
        # v2.x is a complete rewrite on MyST and uses incompatible config.
        run: |
          python -m pip install --upgrade pip
          pip install "jupyter-book<2.0" numpy matplotlib ipykernel

      - name: Build the book
        run: jupyter-book build .

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
